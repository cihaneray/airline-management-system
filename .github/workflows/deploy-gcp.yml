name: Deploy to Google Cloud

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-gcp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/airline/api

      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Resolve Deployment Commit
        id: deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            DEPLOY_SHA="${{ github.sha}}"
          fi
          
          if [ -z "$DEPLOY_SHA" ]; then
            echo "Failed to resolve deployment commit"
            exit 1
          fi
          
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $DEPLOY_SHA"

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployment.outputs.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry Authentication
        shell: bash
        run: |
          set -Eeuo pipefail
          
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: 'docker-container'

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.deployment.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ steps.deployment.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure Deployment SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          set -Eeuo pipefail
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare Deployment Directory
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          
          ssh -i ~/.ssh/deploy_key "$VM_USER"@"$VM_HOST" "sudo mkdir -p /opt/airline/config /opt/airline/nginx && sudo chown -R $VM_USER:$VM_USER /opt/airline"

      - name: Copy Production Configuration
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          set -Eeuo pipefail
          
          scp -i ~/.ssh/deploy_key compose.prod.yaml "$VM_USER"@"$VM_HOST":/opt/airline/compose.prod.yaml
          scp -i ~/.ssh/deploy_key nginx/default.conf "$VM_USER"@"$VM_HOST":/opt/airline/nginx/default.conf

      - name: Deploy Application
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          IMAGE_TAG: ${{ steps.deployment.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          
          ssh -i ~/.ssh/deploy_key "$VM_USER"@"$VM_HOST" bash -s -- \
            "$GCP_PROJECT_ID" \
            "$GCP_REGION" \
            "$IMAGE_TAG" <<'REMOTE'
          
          set -Eeuo pipefail
          
          GCP_PROJECT_ID="$1"
          GCP_REGION="$2"
          export IMAGE_TAG="$3"
          export GCP_PROJECT_ID
          export GCP_REGION
          
          cd /opt/airline
          
          export GCP_PROJECT_ID
          export GCP_REGION
          export IMAGE_TAG
          
          echo "Deploying image:"
          echo "${GCP_REGION}-docker.pkg.dev/$GCP_PROJECT_ID/airline/api:$IMAGE_TAG"
          
          cat > .deploy.env <<EOF
          GCP_PROJECT_ID=${GCP_PROJECT_ID}
          GCP_REGION=${GCP_REGION}
          IMAGE_TAG=${IMAGE_TAG}
          EOF
          
          chmod 600 .deploy.env
          
          if [ ! -f .env ]; then
            echo "Missing production file: /opt/airline/.env"
            exit 1
          fi
          
          if ! grep -q '^ALLOWED_HOSTS=' .env; then
            echo "Missing ALLOWED_HOSTS in /opt/airline/.env"
            exit 1
          fi
          
          if ! grep -q '^SECRET_KEY=' .env; then
            echo "Missing SECRET_KEY in /opt/airline/.env"
            exit 1
          fi
          
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          
          docker compose \
            --env-file .env \
            --env-file .deploy.env \
            -f compose.prod.yaml \
            config \
            | grep -A2 -B2 "${GCP_REGION}-docker.pkg.dev" || true
          
          docker compose --env-file .env --env-file .deploy.env -f compose.prod.yaml pull api
          
          docker compose --env-file .env --env-file .deploy.env -f compose.prod.yaml up -d db
          
          echo "Waiting for PostgreSQL health check..." 
          for attempt in $(seq 1 30); do
            DB_STATUS="$( 
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                airline-db-1 2>/dev/null || true 
            )"
            
            if [ "$DB_STATUS" = "healthy" ]; then 
              echo "PostgreSQL is healthy." 
              break 
            fi
          
            if [ "$attempt" -eq 30 ]; then 
              echo "PostgreSQL did not become healthy." 
              docker compose \
                --env-file .env \
                --env-file .deploy.env \
                -f compose.prod.yaml \
                logs --tail=200 db 
              exit 1 
            fi
          
            sleep 2
          done
          
          docker compose --env-file .env --env-file .deploy.env -f compose.prod.yaml run --rm api python manage.py check
          
          docker compose --env-file .env --env-file .deploy.env -f compose.prod.yaml run --rm api python manage.py migrate --noinput
          
          docker compose --env-file .env --env-file .deploy.env -f compose.prod.yaml run --rm api python manage.py collectstatic --noinput
          
          docker compose --env-file .env --env-file .deploy.env -f compose.prod.yaml up -d --force-recreate --remove-orphans
          
          docker compose --env-file .env --env-file .deploy.env -f compose.prod.yaml ps
          
          docker image prune -f
          REMOTE