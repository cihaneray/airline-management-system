name: Deploy to Google Cloud

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-gcp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: >-
        ${{ vars.GCP_REGION }}-docker.pkg.dev/${{
        vars.GCP_PROJECT_ID }}/airline/api

      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: >-
            ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry Authentication
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure Deployment SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy Production Configuration
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_USER"@"$VM_HOST" "sudo mkdir -p /opt/airline/config /opt/airline/nginx && sudo chown -R $VM_USER:$VM_USER /opt/airline"
          scp -i ~/.ssh/deploy_key compose.prod.yaml "$VM_USER"@"$VM_HOST":/opt/airline/compose.prod.yaml
          scp -i ~/.ssh/deploy_key nginx/default.conf "$VM_USER"@"$VM_HOST":/opt/airline/nginx/default.conf

      - name: Deploy Application
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          VM_USER: ${{ secrets.GCP_VM_USER }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_USER"@"$VM_HOST" "GCP_PROJECT_ID='$GCP_PROJECT_ID' GCP_REGION='$GCP_REGION' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          
          cd /opt/airline
          
          export GCP_PROJECT_ID
          export GCP_REGION
          export IMAGE_TAG
          
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          
          docker compose --env-file .env -f compose.prod.yaml pull api
          
          docker compose --env-file .env -f compose.prod.yaml up -d db
          
          docker compose --env-file .env -f compose.prod.yaml run --rm api python manage.py migrate --noinput
          
          docker compose --env-file .env -f compose.prod.yaml run --rm api python manage.py collectstatic --noinput
          
          docker compose --env-file .env -f compose.prod.yaml up -d --remove-orphans
          
          docker compose --env-file .env -f compose.prod.yaml ps
          
          docker image prune -f
          REMOTE