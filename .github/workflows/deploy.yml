name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      image_owner: ${{ steps.owner.outputs.value }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Normalize owner name
        id: owner
        shell: bash
        run: |
          echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Define immutable tag
        id: image
        shell: bash
        run: |
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/airline-api:${{ steps.image.outputs.tag }}
            ghcr.io/${{ steps.owner.outputs.value }}/airline-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-push

    environment:
      name: production

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh/
          chmod 700 ~/.ssh/
          
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh-keyscan -p "${VM_SSH_PORT:-22}" -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment configuration
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key -P "${VM_SSH_PORT:-22}" compose.prod.yaml "${VM_USER}@${VM_HOST}:/opt/airline/docker-compose.yml"          
          
          scp -i ~/.ssh/deploy_key -P "${VM_SSH_PORT:-22}" nginx/default.conf "${VM_USER}@${VM_HOST}:/opt/airline/nginx/default.conf"

      - name: Deploy application
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_PORT: ${{ secrets.VM_SSH_PORT }}

          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

          GHCR_OWNER: ${{ needs.build-and-push.outputs.image_owner }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VM_SSH_PORT:-22}" "${VM_USER}@${VM_HOST}" "GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' GHCR_OWNER='$GHCR_OWNER' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          
          cd /opt/airline
          
          echo "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin
          
          export GHCR_OWNER
          export IMAGE_TAG
          
          docker compose --env-file .env -f compose.prod.yaml pull api
          
          docker compose --env-file .env -f compose.prod.yaml up -d db
          
          docker compose --env-file .env -f compose.prod.yaml run --rm api python manage.py migrate --noinput
          
          docker compose --env-file .env -f compose.prod.yaml run --rm api python manage.py collectstatic --noinput
          
          docker compose --env-file .env -f compose.prod.yaml up -d --remove-orphans
          
          docker compose --env-file .env -f compose.prod.yaml ps
          
          docker image prune -f
          REMOTE